# Fly.io configuration for Ember Backend (API + Worker)
app = "ember-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Run both the API server and the ARQ worker under the same app using Fly.io V2 processes!
[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "arq app.workers.tasks.WorkerSettings"

[env]
  ENVIRONMENT = "production"
  RUN_MIGRATIONS_ON_STARTUP = "true"
  ALGORITHM = "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES = "1440"
  REFRESH_TOKEN_EXPIRE_MINUTES = "10080"

[[services]]
  processes = ["app"] # Only route HTTP traffic to the FastAPI app process
  http_service = { internal_port = 8000, force_https = true, auto_start_machines = true, auto_stop_machines = true }
